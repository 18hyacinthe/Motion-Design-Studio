<script type="module">
import * as THREE from 'three';

window.__ready = false;

// ---------------------------------------------------------------------------
// Format
// ---------------------------------------------------------------------------
const DW = 1080, DH = 1920;                     // 2D layout is authored in this space
const FPS = 60, DURATION = 12;
const FONT_BASE = 'https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.3.0/files/';
const JITTER = [[-0.25, -0.25], [0.25, 0.25], [0.25, -0.25], [-0.25, 0.25]];
const params = new URLSearchParams(location.search);
// ?scale=2 renders 2160 x 3840 (4K vertical), ?scale=0.5 a quick 540 x 960 preview
const SCALE = Math.min(4, Math.max(0.25, parseFloat(params.get('scale')) || 1));
const W = Math.round(DW * SCALE), H = Math.round(DH * SCALE);
const fixedT = params.has('t') ? (parseFloat(params.get('t')) || 0) : null;
const ASSETS = JSON.parse(document.getElementById('colibri-assets').textContent);

// camera: 32 degree lens at z = 8 looking at the origin
const FOV = 32, CAM_Z = 8;
const HALF_H = CAM_Z * Math.tan(THREE.MathUtils.degToRad(FOV / 2));
const HALF_W = HALF_H * DW / DH;
const PXU = DH / (2 * HALF_H);                  // design px per world unit at z = 0
const wx = (sx) => (sx / DW * 2 - 1) * HALF_W;
const wy = (sy) => (1 - sy / DH * 2) * HALF_H;

// brand
const C_BLUE = '#2563EB', C_CYAN = '#06B6D4', C_CYAN_L = '#22D3EE', C_NAVY = '#0B1E5B';

// ---------------------------------------------------------------------------
// Easing
// ---------------------------------------------------------------------------
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lin = (a, b, x) => clamp01((x - a) / (b - a));
const mix = (a, b, u) => a + (b - a) * u;
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeOut3 = (u) => 1 - Math.pow(1 - u, 3);
const easeIn3 = (u) => u * u * u;
const snap = (u) => 1 - Math.pow(1 - u, 4) * (1 + 4 * u);
const backOut = (u, s = 1.6) => (u <= 0 ? 0 : u >= 1 ? 1 : 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2));
const sstep = (a, b, x) => { const u = lin(a, b, x); return u * u * (3 - 2 * u); };
// damped spring step response, starts at rest, overshoots `os` once
function springTo(tau, period, os) {
  if (tau <= 0) return 0;
  const w = Math.PI / (period / 2), sig = -Math.log(os) / Math.PI * w;
  return 1 - Math.exp(-sig * tau) * (Math.cos(w * tau) + sig / w * Math.sin(w * tau));
}
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

// ---------------------------------------------------------------------------
// GLSL
// ---------------------------------------------------------------------------
const NOISE_GLSL = /* glsl */`
// 4D simplex noise - Ian McEwan, Stefan Gustavson (Ashima Arts), MIT License
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
float mod289(float x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
float permute(float x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float taylorInvSqrt(float r) { return 1.79284291400159 - 0.85373472095314 * r; }
vec4 grad4(float j, vec4 ip) {
  const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
  vec4 p, s;
  p.xyz = floor(fract(vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
  p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
  s = vec4(lessThan(p, vec4(0.0)));
  p.xyz = p.xyz + (s.xyz * 2.0 - 1.0) * s.www;
  return p;
}
float snoise(vec4 v) {
  const vec4 C = vec4(0.138196601125011, 0.276393202250021, 0.414589803375032, -0.447213595499958);
  vec4 i = floor(v + dot(v, vec4(0.309016994374947451)));
  vec4 x0 = v - i + dot(i, C.xxxx);
  vec4 i0;
  vec3 isX = step(x0.yzw, x0.xxx);
  vec3 isYZ = step(x0.zww, x0.yyz);
  i0.x = isX.x + isX.y + isX.z;
  i0.yzw = 1.0 - isX;
  i0.y += isYZ.x + isYZ.y;
  i0.zw += 1.0 - isYZ.xy;
  i0.z += isYZ.z;
  i0.w += 1.0 - isYZ.z;
  vec4 i3 = clamp(i0, 0.0, 1.0);
  vec4 i2 = clamp(i0 - 1.0, 0.0, 1.0);
  vec4 i1 = clamp(i0 - 2.0, 0.0, 1.0);
  vec4 x1 = x0 - i1 + C.xxxx;
  vec4 x2 = x0 - i2 + C.yyyy;
  vec4 x3 = x0 - i3 + C.zzzz;
  vec4 x4 = x0 + C.wwww;
  i = mod289(i);
  float j0 = permute(permute(permute(permute(i.w) + i.z) + i.y) + i.x);
  vec4 j1 = permute(permute(permute(permute(
      i.w + vec4(i1.w, i2.w, i3.w, 1.0))
    + i.z + vec4(i1.z, i2.z, i3.z, 1.0))
    + i.y + vec4(i1.y, i2.y, i3.y, 1.0))
    + i.x + vec4(i1.x, i2.x, i3.x, 1.0));
  vec4 ip = vec4(1.0 / 294.0, 1.0 / 49.0, 1.0 / 7.0, 0.0);
  vec4 p0 = grad4(j0, ip);
  vec4 p1 = grad4(j1.x, ip);
  vec4 p2 = grad4(j1.y, ip);
  vec4 p3 = grad4(j1.z, ip);
  vec4 p4 = grad4(j1.w, ip);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  p4 *= taylorInvSqrt(dot(p4, p4));
  vec3 m0 = max(0.6 - vec3(dot(x0, x0), dot(x1, x1), dot(x2, x2)), 0.0);
  vec2 m1 = max(0.6 - vec2(dot(x3, x3), dot(x4, x4)), 0.0);
  m0 = m0 * m0; m1 = m1 * m1;
  return 49.0 * (dot(m0 * m0, vec3(dot(p0, x0), dot(p1, x1), dot(p2, x2)))
               + dot(m1 * m1, vec2(dot(p3, x3), dot(p4, x4))));
}
`;

const FS_VERT = /* glsl */`
varying vec2 vUv;
void main() { vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

// Liquid droplets -> blob -> extruded Colibri logo, one SDF.
const LOGO_FRAG = /* glsl */`
#define HD 0.07                                  // core half-depth of the logo (object units)
uniform mat4 uCamWorld;
uniform mat4 uProjInv;
uniform vec3 uCamPos;
uniform vec2 uRes;
uniform float uTime;
uniform sampler2D uSdf;                          // R: bubble outline, G: bird
uniform vec4 uTexRect;
uniform vec4 uOuterBox;
uniform vec4 uBirdBox;
uniform vec3 uLogoPos;
uniform mat3 uLogoRot;                           // world -> object
uniform float uLogoScale;
uniform float uK;                                // liquid -> logo morph
uniform float uBevel;
uniform float uReveal;
uniform vec4 uBirdAxis;                          // tail.xy, dir.xy
uniform float uBirdLen;
uniform vec4 uBlob;                              // centre, radius
uniform vec3 uBlobScale;
uniform float uNoiseAmp;
uniform vec4 uDrop[3];
uniform vec4 uDropAx[3];
uniform float uSmooth;
uniform vec4 uBound;
uniform float uGlintX;
uniform float uGlintOn;
uniform int uZero;

const vec3 BLUE = vec3(0.0185, 0.1248, 0.8308);   // #2563EB linear
const vec3 CYAN = vec3(0.0018, 0.4678, 0.6584);   // #06B6D4 linear
const vec3 WHITE = vec3(0.86);

${NOISE_GLSL}

float smin(float a, float b, float k) {
  k = max(k, 1e-4);
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
float sdEllipsoid(vec3 p, vec3 r) {
  float k0 = length(p / r);
  float k1 = length(p / (r * r));
  return k0 * (k0 - 1.0) / max(k1, 1e-6);
}
float boxDist2(vec2 q, vec4 b) {
  vec2 d = abs(q - b.xy) - b.zw;
  return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
}

// object space: logo is 1 unit wide, front face towards +z
vec2 logoObj(vec3 q) {
  vec2 uv = (q.xy - uTexRect.xy) / uTexRect.zw;
  float d2o, d2b;
  if (uv.x < 0.0 || uv.y < 0.0 || uv.x > 1.0 || uv.y > 1.0) {
    d2o = boxDist2(q.xy, uOuterBox);
    d2b = boxDist2(q.xy, uBirdBox);
  } else {
    vec2 s = textureLod(uSdf, uv, 0.0).rg;
    d2o = s.r; d2b = s.g;
  }
  float R = uBevel;
  vec2 w = vec2(d2o, abs(q.z) - HD);
  float body = min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - R;
  float front = HD + R;
  // the bird draws itself in from tail to head
  float plane = dot(q.xy - uBirdAxis.xy, uBirdAxis.zw) - uReveal * uBirdLen;
  float rec = max(max(d2b, front - 0.032 - q.z), plane);
  body = smax(body, -rec, 0.008);
  vec2 wb = vec2(d2b + 0.012, abs(q.z - (front - 0.009)) - 0.016);
  float bird = min(max(wb.x, wb.y), 0.0) + length(max(wb, 0.0)) - 0.007;
  bird = max(bird, plane);
  return bird < body ? vec2(bird, 1.0) : vec2(body, 0.0);
}
vec2 mapLogo(vec3 p) {
  vec2 r = logoObj(uLogoRot * (p - uLogoPos) / uLogoScale);
  r.x *= uLogoScale;
  return r;
}
float sdDrop(int i, vec3 p) {
  vec4 dr = uDrop[i], ax = uDropAx[i];
  vec3 q = p - dr.xyz;
  float s = ax.w, rs = sqrt(s);
  float qa = dot(q, ax.xyz);
  vec3 q2 = ax.xyz * (qa / s) + (q - ax.xyz * qa) * rs;
  return (length(q2) - dr.w) / rs;
}
float mapLiquid(vec3 p) {
  float d = 1e5;
  if (uBlob.w > 0.0) {
    vec3 q = p - uBlob.xyz;
    d = sdEllipsoid(q, uBlob.w * uBlobScale);
    if (uNoiseAmp > 0.0 && d < 0.3) d += uNoiseAmp * snoise(vec4(q * 2.2, uTime * 0.7));
  }
  for (int i = 0; i < 3; i++) {
    if (uDrop[i].w <= 0.0) continue;
    d = smin(d, sdDrop(i, p), uSmooth);
  }
  return d;
}
vec2 map(vec3 p) {
  if (uK <= 0.001) return vec2(mapLiquid(p), 0.0);
  vec2 lg = mapLogo(p);
  if (uK >= 0.999) return lg;
  return vec2(mix(mapLiquid(p), lg.x, uK), lg.y);
}

vec3 calcNormal(vec3 p) {
  vec3 n = vec3(0.0);
  for (int i = uZero; i < 4; i++) {
    vec3 e = 0.5773 * (2.0 * vec3(float(((i + 3) >> 1) & 1), float((i >> 1) & 1), float(i & 1)) - 1.0);
    n += e * map(p + 0.0012 * e).x;
  }
  return normalize(n);
}
float calcAO(vec3 p, vec3 n) {
  float occ = 0.0, sca = 1.0;
  for (int i = uZero; i < 4; i++) {
    float h = 0.008 + 0.022 * float(i);
    occ += (h - map(p + n * h).x) * sca;
    sca *= 0.7;
  }
  return clamp(1.0 - 4.0 * occ, 0.0, 1.0);
}

// ---- studio
float box2(vec2 p, vec2 c, vec2 hs, float s) {
  vec2 d = abs(p - c) - hs;
  return 1.0 - smoothstep(-s, s, max(d.x, d.y));
}
vec3 env(vec3 d) {
  vec3 c = mix(vec3(0.008, 0.016, 0.05), vec3(0.05, 0.11, 0.28), smoothstep(-0.3, 0.9, d.y));
  // big front-top beauty softbox: the glossy face catches it
  c += vec3(8.0) * box2(d.xy, vec2(0.0, 0.3), vec2(0.5, 0.1), 0.05) * step(0.0, d.z);
  // overhead strip
  c += vec3(3.0) * box2(d.xz, vec2(0.0, -0.1), vec2(0.6, 0.12), 0.05) * step(0.6, d.y);
  // left tall strip, cool white
  c += vec3(2.6, 2.8, 3.0) * box2(vec2(d.z, d.y), vec2(0.15, 0.1), vec2(0.18, 0.55), 0.05) * step(0.6, -d.x);
  // right cyan rim
  c += vec3(0.4, 1.7, 2.2) * box2(vec2(d.z, d.y), vec2(-0.2, 0.15), vec2(0.22, 0.5), 0.08) * step(0.6, d.x);
  // glint sweep
  if (uGlintOn > 0.0) {
    float u = (d.x - uGlintX) * 0.866 + d.y * 0.5;
    c += vec3(9.0) * uGlintOn * (1.0 - smoothstep(0.02, 0.07, abs(u))) * step(0.0, d.z);
  }
  return c;
}
vec3 ambient(vec3 n) {
  return mix(vec3(0.03, 0.06, 0.16), vec3(0.32, 0.42, 0.7), n.y * 0.5 + 0.5) + vec3(0.22) * max(n.z, 0.0);
}

vec3 shade(vec3 p, vec3 rd, float mat) {
  vec3 n = calcNormal(p);
  vec3 qo = uLogoRot * (p - uLogoPos) / uLogoScale;
  vec3 logoAlb = mix(BLUE, CYAN, smoothstep(0.0, 1.0, clamp(qo.x * 0.95 + qo.y * 0.2 + 0.5, 0.0, 1.0)));
  vec3 lq = (p - uBlob.xyz) / max(uBlob.w, 0.2);
  vec3 liqAlb = mix(BLUE, CYAN, smoothstep(0.0, 1.0, clamp(lq.x * 0.45 + lq.y * 0.12 + 0.5, 0.0, 1.0)));
  vec3 alb = mix(mix(liqAlb, logoAlb, uK), WHITE, mat);
  float ao = calcAO(p, n);
  float NoV = clamp(dot(n, -rd), 0.0, 1.0);
  float F = 0.05 + 0.95 * pow(1.0 - NoV, 5.0);
  vec3 key = vec3(1.5) * max(dot(n, normalize(vec3(-0.5, 0.75, 0.55))), 0.0);
  vec3 diff = alb * (ambient(n) + key) * ao;
  vec3 spec = env(reflect(rd, n)) * F * mix(ao, 1.0, 0.4);
  return diff * (1.0 - F) + spec;
}

void main() {
  vec2 ndc = gl_FragCoord.xy / uRes * 2.0 - 1.0;
  vec4 v = uProjInv * vec4(ndc, 1.0, 1.0);
  vec3 rd = normalize((uCamWorld * vec4(normalize(v.xyz / v.w), 0.0)).xyz);
  vec3 ro = uCamPos;
  // bounding sphere
  vec3 oc = ro - uBound.xyz;
  float b = dot(oc, rd), c = dot(oc, oc) - uBound.w * uBound.w, h = b * b - c;
  if (h < 0.0) { gl_FragColor = vec4(0.0); return; }
  h = sqrt(h);
  float t = max(-b - h, 0.0), te = -b + h;
  float pix = 1.3 / uRes.y * 0.574;               // ~1.3 px cone, tan(16 deg) * 2 / height
  float bestR = 1e9, bestT = t, hitT = -1.0, mat = 0.0;
  for (int i = 0; i < 160; i++) {
    vec2 m = map(ro + rd * t);
    float r = m.x / (pix * t);
    if (r < bestR) { bestR = r; bestT = t; mat = m.y; }
    if (m.x < 0.25 * pix * t) { hitT = t; break; }
    t += m.x * 0.8;
    if (t > te) break;
  }
  float alpha;
  if (hitT > 0.0) { alpha = 1.0; bestT = hitT; }
  else alpha = clamp(1.0 - bestR, 0.0, 1.0);    // silhouette coverage from the near miss
  if (alpha <= 0.0) { gl_FragColor = vec4(0.0); return; }
  vec3 col = shade(ro + rd * bestT, rd, mat);
  gl_FragColor = vec4(col * alpha, alpha);
}
`;

const BAKE_FRAG = /* glsl */`
uniform highp sampler2D uSeg;
uniform vec4 uRect;
uniform vec2 uRes;
uniform vec4 uRng;                               // outer start, count, bird start, count
float field(vec2 q, int s, int n) {
  float md = 1e9;
  bool inside = false;
  for (int k = 0; k < 4096; k++) {
    if (k >= n) break;
    int idx = s + k;
    vec4 sg = texelFetch(uSeg, ivec2(idx % 1024, idx / 1024), 0);
    vec2 a = sg.xy, e = sg.zw - sg.xy, w = q - a;
    float h = clamp(dot(w, e) / max(dot(e, e), 1e-14), 0.0, 1.0);
    vec2 dv = w - e * h;
    md = min(md, dot(dv, dv));
    if ((sg.y > q.y) != (sg.w > q.y)) {
      float xi = sg.x + (q.y - sg.y) * (sg.z - sg.x) / (sg.w - sg.y);
      if (q.x < xi) inside = !inside;
    }
  }
  float d = sqrt(md);
  return inside ? -d : d;
}
void main() {
  vec2 q = uRect.xy + gl_FragCoord.xy / uRes * uRect.zw;
  gl_FragColor = vec4(field(q, int(uRng.x + 0.5), int(uRng.y + 0.5)), field(q, int(uRng.z + 0.5), int(uRng.w + 0.5)), 0.0, 1.0);
}
`;

// background + 2D layers + raymarched logo, in linear light
const COMPOSE_FRAG = /* glsl */`
uniform sampler2D tBg;
uniform sampler2D tLogo;
uniform sampler2D tFg;
uniform vec2 uRes;
uniform float uTime;
uniform float uFade;
uniform vec3 uGlow;                              // x, y (0..1, y up), strength
vec3 lin(vec3 c) { return pow(c, vec3(2.2)); }
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 asp = vec2(uRes.x / uRes.y, 1.0);
  vec3 col = mix(lin(vec3(0.051, 0.231, 0.698)), lin(vec3(0.027, 0.075, 0.24)), smoothstep(0.0, 1.0, uv.y));
  vec2 g = (uv - uGlow.xy) * asp;
  col += lin(vec3(0.12, 0.55, 1.0)) * 0.55 * uGlow.z * exp(-dot(g, g) / (2.0 * 0.2 * 0.2));
  col += lin(vec3(0.13, 0.83, 0.93)) * 0.22 * uGlow.z * exp(-dot(g, g) / (2.0 * 0.07 * 0.07));
  // slow diagonal light beams
  float beam = 0.5 + 0.5 * sin((uv.x * 0.9 - uv.y * 0.45) * 7.0 + uTime * 0.5);
  col += vec3(0.010, 0.022, 0.05) * pow(beam, 6.0) * (0.4 + 0.6 * uv.y);
  vec4 bg = texture(tBg, uv);
  col = mix(col, bg.rgb, bg.a);
  vec4 lg = texture(tLogo, uv);
  col = col * (1.0 - lg.a) + lg.rgb;
  vec4 fg = texture(tFg, uv);
  col = mix(col, fg.rgb, fg.a);
  gl_FragColor = vec4(col * uFade, 1.0);
}
`;

const BRIGHT_FRAG = /* glsl */`
uniform sampler2D tSrc;
uniform vec2 uTexel;
varying vec2 vUv;
void main() {
  vec3 c = texture(tSrc, vUv).rgb * 4.0;
  c += texture(tSrc, vUv + uTexel * vec2(-1.0, -1.0)).rgb;
  c += texture(tSrc, vUv + uTexel * vec2( 1.0, -1.0)).rgb;
  c += texture(tSrc, vUv + uTexel * vec2(-1.0,  1.0)).rgb;
  c += texture(tSrc, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
  c /= 8.0;
  float br = max(c.r, max(c.g, c.b));
  const float knee = 0.2;
  float soft = clamp(br - 1.0 + knee, 0.0, 2.0 * knee);
  soft = soft * soft / (4.0 * knee);
  gl_FragColor = vec4(c * max(soft, br - 1.0) / max(br, 1e-5), 1.0);
}
`;
const DOWN_FRAG = /* glsl */`
uniform sampler2D tSrc;
uniform vec2 uTexel;
varying vec2 vUv;
void main() {
  vec3 c = texture(tSrc, vUv).rgb * 4.0;
  c += texture(tSrc, vUv + uTexel * vec2(-1.0, -1.0)).rgb;
  c += texture(tSrc, vUv + uTexel * vec2( 1.0, -1.0)).rgb;
  c += texture(tSrc, vUv + uTexel * vec2(-1.0,  1.0)).rgb;
  c += texture(tSrc, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
  gl_FragColor = vec4(c / 8.0, 1.0);
}
`;
const UP_FRAG = /* glsl */`
uniform sampler2D tSrc;
uniform sampler2D tCur;
uniform vec2 uTexel;
varying vec2 vUv;
void main() {
  vec2 d = uTexel;
  vec3 c = texture(tSrc, vUv).rgb * 4.0;
  c += (texture(tSrc, vUv + vec2(d.x, 0.0)).rgb + texture(tSrc, vUv - vec2(d.x, 0.0)).rgb
      + texture(tSrc, vUv + vec2(0.0, d.y)).rgb + texture(tSrc, vUv - vec2(0.0, d.y)).rgb) * 2.0;
  c += texture(tSrc, vUv + d).rgb + texture(tSrc, vUv - d).rgb
     + texture(tSrc, vUv + vec2(d.x, -d.y)).rgb + texture(tSrc, vUv - vec2(d.x, -d.y)).rgb;
  gl_FragColor = vec4(c / 16.0 + texture(tCur, vUv).rgb, 1.0);
